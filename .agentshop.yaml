# Agent Shop per-repository configuration (agent-shop #308).
#
# These must match what .github/workflows enforces, or a worker can pass verify
# and still be blocked by CI — which is exactly what happened to PR #84 on
# 2026-09-13: `ruff format --check` failed a PR that no configured command
# covered (agent-shop #481). CI runs `ruff check .`, `ruff format --check .`
# and `pytest`, so these mirror it.
#
# `lint` goes through `bash -c` because agent-shop runs verify commands with
# `shlex.split` and no shell (verify.py), so an `&&` would be handed to ruff as
# a literal argument. CI's gate is two commands; the config field is one.
verify:
  # Pinned to this repo's venv rather than whatever `pytest` and `ruff` resolve
  # to on PATH. `git rev-parse --git-common-dir` finds the MAIN checkout's .git
  # even from inside a worktree, so `/../.venv` is this repo's venv wherever
  # verify runs; the working directory stays the worktree, so the tests and the
  # lint still target the branch under review.
  #
  # A plain relative `.venv/bin/pytest` cannot work here: workers verify inside
  # a fresh git worktree and `.venv` is gitignored, so it is not there.
  #
  # Why this matters: PR #103 was verified as a FAILING suite (0.4s, a
  # collection error) because the PATH `pytest` had no `typer`, which this repo
  # declares in requirements.txt. The run summary said "Red suite: 1" about code
  # that CI proved green. Verify that reports working code as broken trains an
  # operator to ignore it.
  #
  # `bash -c` because verify runs through `shlex.split` with no shell, so
  # `$(...)` would otherwise reach pytest as a literal argument.
  test: "bash -c 'exec \"$(git rev-parse --git-common-dir)/../.venv/bin/pytest\" -q'"
  lint: "bash -c 'R=\"$(git rev-parse --git-common-dir)/../.venv/bin/ruff\"; \"$R\" check . && \"$R\" format --check .'"
labels:
  ready: agent-ready
  health: code-health
auto_merge: true

# This repo is a sandbox: fast iteration is the point and a mess is cheap
# (agent-shop #418). Declared rather than inferred — without this line, a repo
# with no CI is treated as a project that has not set its baselines up yet, and
# `auto_merge` falls back to `gated` because a PR with no checks passes the CI
# gate vacuously.
environment: sandbox
