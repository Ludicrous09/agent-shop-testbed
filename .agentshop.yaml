# Agent Shop per-repository configuration (agent-shop #308).
#
# These must match what .github/workflows enforces, or a worker can pass verify
# and still be blocked by CI — which is exactly what happened to PR #84 on
# 2026-09-13: `ruff format --check` failed a PR that no configured command
# covered (agent-shop #481). CI runs `ruff check .`, `ruff format --check .`
# and `pytest`, so these mirror it.
#
# `lint` goes through `bash -c` because agent-shop runs verify commands with
# `shlex.split` and no shell (verify.py), so an `&&` would be handed to ruff as
# a literal argument. CI's gate is two commands; the config field is one.
verify:
  test: "pytest -q"
  lint: "bash -c 'ruff check . && ruff format --check .'"
labels:
  ready: agent-ready
  health: code-health
auto_merge: true

# This repo is a sandbox: fast iteration is the point and a mess is cheap
# (agent-shop #418). Declared rather than inferred — without this line, a repo
# with no CI is treated as a project that has not set its baselines up yet, and
# `auto_merge` falls back to `gated` because a PR with no checks passes the CI
# gate vacuously.
environment: sandbox
