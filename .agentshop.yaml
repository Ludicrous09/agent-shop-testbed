# Agent Shop per-repository configuration (agent-shop #308).
# The verify commands are deliberately more specific than the built-in
# defaults ("pytest -q" / "ruff check .") so a live run demonstrably picks
# these up rather than falling back.
verify:
  test: "python -m pytest -q tests/"
  lint: "ruff check src tests"
labels:
  ready: agent-ready
  health: code-health
auto_merge: true

# This repo is a sandbox: fast iteration is the point and a mess is cheap
# (agent-shop #418). Declared rather than inferred — without this line, a repo
# with no CI is treated as a project that has not set its baselines up yet, and
# `auto_merge` falls back to `gated` because a PR with no checks passes the CI
# gate vacuously.
environment: sandbox
